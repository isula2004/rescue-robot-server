<!DOCTYPE html>
<html>
<head>
    <title>Disaster Rescue Robot Dashboard</title>

    <style>
        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #ffffff;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .container {
            width: 95%;
            margin: auto;
        }
        .top-section {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .video-box {
            width: 70%;
            height: 450px;
            background-color: #1a1a1a;
            border: 3px solid #1e90ff;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #ff4d4d;
            font-weight: bold;
        }
        .controls-box {
            width: 27%;
            background-color: #111;
            border: 2px solid #1e90ff;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            transition: opacity 0.4s ease;
        }
        .disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        button {
            background-color: #1e90ff;
            border: none;
            border-radius: 5px;
            padding: 10px;
            margin: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            width: 120px;
        }
        button:hover {
            background-color: #0e70d1;
        }
        .middle-section {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .sensor-box {
            width: 60%;
            background-color: #111;
            border: 2px solid #1e90ff;
            border-radius: 6px;
            padding: 10px 20px;
            text-align: left;
        }
        .autopilot-box {
            width: 35%;
            background-color: #111;
            border: 2px solid #1e90ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .autopilot-button {
            width: 80%;
            height: 50px;
            background-color: #cc0000;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        .map-wrapper {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            height: 420px;
        }
        .map-box {
            flex: 1;
            background-color: #1a1a1a;
            border: 3px solid #1e90ff;
            border-radius: 8px;
        }
        .gps-info {
            width: 260px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #1e90ff;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            font-size: 16px;
            color: #00ff9d;
            box-shadow: 0 0 10px #1e90ff;
        }
        .gps-info h3 {
            margin-top: 0;
            color: #00e6ff;
            text-align: center;
        }
        .gps-info p {
            margin: 8px 0;
        }
        #human {
            font-weight: bold;
            font-size: 20px;
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<h1>
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png"
         width="45" height="45">
    Disaster Rescue Robot Dashboard
</h1>

<div class="container">

    <div class="top-section">
        <div class="video-box" id="video">🚫 ROBOT OFFLINE</div>

        <div class="controls-box" id="controlBox">
            <h3>Robot Controls</h3>
            <button onclick="sendCommand('forward')">Forward</button><br>
            <button onclick="sendCommand('left')">Left</button>
            <button onclick="sendCommand('right')">Right</button><br>
            <button onclick="sendCommand('backward')">Backward</button>

            <h3>Camera</h3>
            <button onclick="sendCommand('cam_up')">Up</button><br>
            <button onclick="sendCommand('cam_left')">Left</button>
            <button onclick="sendCommand('cam_right')">Right</button><br>
            <button onclick="sendCommand('cam_down')">Down</button>
        </div>
    </div>

    <div class="middle-section">
        <div class="sensor-box">
            <h3>Sensor Data</h3>
            <p>Temperature: <span id="temp">--</span> °C</p>
            <p>Gas Level: <span id="gas">--</span> %</p>
            <p>Human Detection: <span id="human">--</span></p>
        </div>

        <div class="autopilot-box">
            <button class="autopilot-button" id="autopilotBtn"
                    onclick="toggleAutopilot()">AUTO PILOT</button>
        </div>
    </div>

    <div class="map-wrapper">
        <div class="map-box" id="map"></div>

        <div class="gps-info" id="gpsBox">
            <h3>📍 GPS DATA</h3>
            <p><b>Latitude:</b> <span id="lat">--</span></p>
            <p><b>Longitude:</b> <span id="lon">--</span></p>
            <p><b>Altitude:</b> <span id="alt">--</span> m</p>
        </div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let autopilot = false;

function sendCommand(cmd) {
    socket.emit("robot-command", cmd);
}

function toggleAutopilot() {
    autopilot = !autopilot;
    let ctrl = document.getElementById("controlBox");
    let btn = document.getElementById("autopilotBtn");

    if (autopilot) {
        ctrl.classList.add("disabled");
        btn.textContent = "TAKE CONTROL";
        btn.style.backgroundColor = "#ff9500";
    } else {
        ctrl.classList.remove("disabled");
        btn.textContent = "AUTO PILOT";
        btn.style.backgroundColor = "#cc0000";
    }
    socket.emit("autopilot", autopilot);
}
</script>

<script>
// ✅ Init map — zoomed out a bit so map tiles load correctly
let map = L.map('map').setView([6.9271, 79.8612], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 22,
}).addTo(map);

let gpsMarker = L.marker([6.9271, 79.8612]).addTo(map);
let robotPath = L.polyline([], {weight: 3, color: "cyan"}).addTo(map);

socket.on("robot-data", (data) => {
    document.getElementById("temp").innerText = data.temperature;
    document.getElementById("gas").innerText = data.gas;

    let humanState = document.getElementById("human");
    humanState.innerText = data.humanDetected;
    humanState.style.color = data.humanDetected === "YES" ? "red" : "#0f0";

    const { lat, lng, alt } = data.gps;

    document.getElementById("lat").innerText = lat.toFixed(6);
    document.getElementById("lon").innerText = lng.toFixed(6);
    document.getElementById("alt").innerText = alt.toFixed(2);

    gpsMarker.setLatLng([lat, lng]);
    robotPath.addLatLng([lat, lng]);
});
</script>

</body>
</html>
